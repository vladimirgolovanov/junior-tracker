name: Build and Deploy

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vladimirgolovanov/junior-tracker

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile-prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy
        run: |
          kubectl apply -f k8s/

      - name: Run migrations
        run: |
          kubectl delete job junior-tracker-migrate -n junior-tracker --ignore-not-found
          kubectl apply -f - <<'EOF'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: junior-tracker-migrate
            namespace: junior-tracker
          spec:
            template:
              spec:
                imagePullSecrets:
                  - name: ghcr-secret
                containers:
                  - name: migrate
                    image: ghcr.io/vladimirgolovanov/junior-tracker:latest
                    command: ["alembic", "upgrade", "head"]
                    envFrom:
                      - secretRef:
                          name: junior-tracker-env
                restartPolicy: Never
            backoffLimit: 0
          EOF
          kubectl wait job/junior-tracker-migrate -n junior-tracker --for=condition=complete --timeout=120s

      - name: Restart deployments
        run: |
          kubectl rollout restart deployment/junior-tracker-api -n junior-tracker
          kubectl rollout restart deployment/junior-tracker-worker -n junior-tracker
          kubectl rollout status deployment/junior-tracker-api -n junior-tracker --timeout=120s
          kubectl rollout status deployment/junior-tracker-worker -n junior-tracker --timeout=120s